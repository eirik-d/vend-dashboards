function makeChart(canvasId, dates, values, peakDate, peakVal, isPeakToday, color) {
  const ctx = document.getElementById(canvasId).getContext("2d");

  const peakAnnotations = {
    peakPoint: {
      type: "point",
      xValue: peakDate,
      yValue: peakVal,
      backgroundColor: "#D32F2F",
      borderColor: "white",
      borderWidth: 2,
      radius: 6,

    peakHLine: {
      type: "line",
      yMin: peakVal,
      yMax: peakVal,
      borderColor: "#D32F2F55",
      borderWidth: 1,
      borderDash: [6, 4],
      label: {
        display: true,

        color: "#D32F2F",

        padding: { top: 3, bottom: 3, left: 6, right: 6 },
        borderRadius: 3,
      }
    },
  };

  new Chart(ctx, {
    type: "line",
    data: {
      labels: dates,
      datasets: [{
        label: "Aktive annonser",
        data: values,
        borderColor: color,
        backgroundColor: color + "14",
        fill: true,
        borderWidth: 1.5,
        pointRadius: 0,
        pointHitRadius: 8,
        tension: 0.1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 40 } },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#474445",
          titleFont: { family: "FINN Type, Inter, system-ui" },
          bodyFont: { family: "FINN Type, Inter, system-ui" },
          callbacks: {
            label: ctx => ctx.parsed.y.toLocaleString("nb-NO") + " aktive annonser"
          }
        },
        annotation: { annotations: peakAnnotations }
      },
      scales: {
        x: {
          type: "time",
          time: { unit: "quarter", displayFormats: { quarter: "MMM yyyy" } },
          grid: { display: false },
          ticks: { font: { family: "FINN Type, Inter, system-ui", size: 11 }, color: "#767677" }
        },
        y: {
          beginAtZero: true,
          grid: { color: "#f0f0f0" },
          ticks: {
            font: { family: "FINN Type, Inter, system-ui", size: 11 },
            color: "#767677",
            callback: v => (v/1000).toFixed(0) + "k"
          }
        }
      }
    }
  });
}
